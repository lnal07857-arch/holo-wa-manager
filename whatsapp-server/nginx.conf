events {
    worker_connections 1024;
}

http {
    # Map X-Worker-ID header to specific backend
    map $http_x_worker_id $target_backend {
        "worker-01" "http://whatsapp-account-1:3001";
        "worker-02" "http://whatsapp-account-2:3002";
        "worker-03" "http://whatsapp-account-3:3003";
        "worker-04" "http://whatsapp-account-4:3004";
        "worker-05" "http://whatsapp-account-5:3005";
        "worker-06" "http://whatsapp-account-6:3006";
        "worker-07" "http://whatsapp-account-7:3007";
        "worker-08" "http://whatsapp-account-8:3008";
        "worker-09" "http://whatsapp-account-9:3009";
        "worker-10" "http://whatsapp-account-10:3010";
        default "";
    }

    # Default upstream for unrouted requests (initialization, health checks)
    upstream whatsapp_backends {
        least_conn;
        server whatsapp-account-1:3001;
        server whatsapp-account-2:3002;
        server whatsapp-account-3:3003;
        server whatsapp-account-4:3004;
        server whatsapp-account-5:3005;
        server whatsapp-account-6:3006;
        server whatsapp-account-7:3007;
        server whatsapp-account-8:3008;
        server whatsapp-account-9:3009;
        server whatsapp-account-10:3010;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        location / {
            # If X-Worker-ID header is set, route to specific worker
            set $backend "";
            if ($target_backend != "") {
                set $backend $target_backend;
            }
            if ($backend = "") {
                set $backend "http://whatsapp_backends";
            }

            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
