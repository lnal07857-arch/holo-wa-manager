events {
    worker_connections 1024;
}

http {
    # Map X-Worker-ID header to specific backend
    # Workers all listen on internal port 3000, addressed by compose service name
    map $http_x_worker_id $target_backend {
        "worker-01" "http://worker-01:3000";
        "worker-02" "http://worker-02:3000";
        "worker-03" "http://worker-03:3000";
        "worker-04" "http://worker-04:3000";
        "worker-05" "http://worker-05:3000";
        "worker-06" "http://worker-06:3000";
        "worker-07" "http://worker-07:3000";
        "worker-08" "http://worker-08:3000";
        "worker-09" "http://worker-09:3000";
        "worker-10" "http://worker-10:3000";
        default "";
    }

    # Default upstream for unrouted requests
    upstream whatsapp_backends {
        least_conn;
        server worker-01:3000;
        server worker-02:3000;
        server worker-03:3000;
        server worker-04:3000;
        server worker-05:3000;
        server worker-06:3000;
        server worker-07:3000;
        server worker-08:3000;
        server worker-09:3000;
        server worker-10:3000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        location / {
            # If X-Worker-ID header is set, route to specific worker
            set $backend "";
            if ($target_backend != "") {
                set $backend $target_backend;
            }
            if ($backend = "") {
                set $backend "http://whatsapp_backends";
            }

            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
