version: '3.8'

services:
  go-whatsapp:
    image: aldinokemal/go-whatsapp-web-multidevice:latest
    container_name: go-whatsapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_PORT=3000
      - APP_DEBUG=false
      - APP_OS=Chrome
      # Webhook: eingehende Nachrichten an Supabase Edge Function senden
      - WHATSAPP_WEBHOOK=${WEBHOOK_URL}
      - WHATSAPP_WEBHOOK_SECRET=${WEBHOOK_SECRET:-secret}
      - WHATSAPP_WEBHOOK_EVENTS=message,message.ack
      - WHATSAPP_AUTO_MARK_READ=false
      - WHATSAPP_PRESENCE_ON_CONNECT=unavailable
      # Optional: Basic Auth
      # - APP_BASIC_AUTH=admin:${BASIC_AUTH_PASSWORD:-changeme}
    volumes:
      - gowa-data:/app/storages
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/app/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gowa-data:
